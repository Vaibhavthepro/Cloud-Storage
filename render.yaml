services:
  # 1. Backend Web Service (Node.js Express + Docker)
  - type: web
    name: cloud-storage-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-storage-db
          property: connectionString
      - key: DEFAULT_STORAGE_QUOTA
        value: 10737418240

  # 2. Frontend Web Service (React + Nginx Docker)
  - type: web
    name: cloud-storage-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cloud-storage-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: cloud-storage-db
    databaseName: cloud_storage
    user: root
    plan: free
